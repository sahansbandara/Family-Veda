name: CI

# Owner: S1. Gate: W2 — CI must be green before any merge into develop.
# Jobs are independent so a failure names the layer that broke.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --logger trx

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/**/TestResults/**
          if-no-files-found: ignore

  web:
    name: Web (React 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (Flutter 3.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (required by the Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] \
          || [ "${{ needs.web.result }}" != "success" ] \
          || [ "${{ needs.mobile.result }}" != "success" ]; then
            echo "One or more jobs failed:"
            echo "  backend: ${{ needs.backend.result }}"
            echo "  web:     ${{ needs.web.result }}"
            echo "  mobile:  ${{ needs.mobile.result }}"
            exit 1
          fi
          echo "All jobs passed."
