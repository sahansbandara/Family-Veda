services:
  - type: web
    name: family-veda-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Seed__Enabled
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: familyveda
      - key: Jwt__Audience
        value: familyveda-clients
      - key: Jwt__Key
        generateValue: true
      - key: Seed__DefaultPassword
        sync: false
      - key: Cors__AllowedOrigins
        sync: false
      - key: Storage__LabReportPath
        value: /var/data/familyveda/lab-reports
      - key: DataProtection__KeysPath
        value: /var/data/familyveda/data-protection-keys
      - key: Storage__MaxUploadBytes
        value: "10485760"
      - key: Ollama__BaseUrl
        sync: false
      - key: Ollama__Model
        value: llama3.1:8b
      - key: Agents__ConfidenceThreshold
        value: "0.60"
      - key: Fcm__ProjectId
        sync: false
      - key: Fcm__ServiceAccountJson
        sync: false
    disk:
      name: family-veda-data
      mountPath: /var/data/familyveda
      sizeGB: 1
