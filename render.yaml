services:
  - type: web
    name: family-veda-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Seed__Enabled
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Issuer
        value: familyveda
      - key: Jwt__Audience
        value: familyveda-clients
      - key: Jwt__Key
        generateValue: true
      - key: Cors__AllowedOrigins
        sync: false
      - key: Storage__LabReportPath
        value: /app/storage/lab-reports
      - key: DataProtection__KeysPath
        value: /app/keys
      - key: Storage__MaxUploadBytes
        value: "10485760"
      - key: Ollama__BaseUrl
        sync: false
      - key: Ollama__Model
        value: llama3.1:8b
      - key: Agents__ConfidenceThreshold
        value: "0.60"
